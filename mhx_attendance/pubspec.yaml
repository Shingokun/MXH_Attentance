name: mhx_attendance
description: "Ứng dụng điểm danh Mùa Hè Xanh — MHX-Attendance"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0

  # Auth
  google_sign_in: ^6.2.1
  google_sign_in_dartio: ^0.3.0 # Windows/Linux (google_sign_in không có native Windows)

  # QR, PDF, Excel
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.0
  printing: ^5.11.0
  syncfusion_flutter_xlsio: ^25.1.39

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
